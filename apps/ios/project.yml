name: Vela
options:
  bundleIdPrefix: com.avaneesh
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  VelaKit:
    path: VelaKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: R2257TJB25
targets:
  Vela:
    type: application
    platform: iOS
    sources:
      - path: Vela
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: VelaKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    info:
      path: Vela/Info.plist
      properties:
        CFBundleDisplayName: Vela
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        VelaAPIBaseURL: $(VELA_API_BASE_URL)
        VelaFirebaseAPIKey: $(FIREBASE_API_KEY)
        VelaFirebaseAppID: $(FIREBASE_APP_ID)
        VelaFirebaseProjectID: $(FIREBASE_PROJECT_ID)
        VelaFirebaseSenderID: $(FIREBASE_GCM_SENDER_ID)
        VelaDemo: $(VELA_DEMO)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avaneesh.vela
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
schemes:
  Vela Dev:
    build:
      targets:
        Vela: all
    run:
      config: Debug
    archive:
      config: Release
  Vela Release:
    build:
      targets:
        Vela: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
